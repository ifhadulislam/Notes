<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="Coming Soon, cursive" font-size="13">
  <!-- lumen -->
  <rect x="10" y="20" width="700" height="110" fill="#FBE3EA" stroke="none"/>
  <text x="20" y="40" fill="#1A1919">Blood flow →</text>
  <!-- endothelium -->
  <g fill="#F4C9A8" stroke="#8A5A3B" stroke-width="1.2">
    <rect x="10" y="130" width="85" height="16" rx="7"/><rect x="99" y="130" width="85" height="16" rx="7"/>
    <rect x="188" y="130" width="85" height="16" rx="7"/><rect x="277" y="130" width="85" height="16" rx="7"/>
    <rect x="366" y="130" width="85" height="16" rx="7"/><rect x="455" y="130" width="85" height="16" rx="7"/>
    <rect x="544" y="130" width="70" height="16" rx="7"/><rect x="630" y="130" width="80" height="16" rx="7"/>
  </g>
  <!-- tissue -->
  <rect x="10" y="150" width="700" height="80" fill="#F3F1E6"/>
  <text x="20" y="222" fill="#1A1919">Tissue (interstitium)</text>
  <!-- neutrophils -->
  <g stroke="#28377C" stroke-width="1.4" fill="#E7E9F7">
    <circle cx="70" cy="70" r="17"/><circle cx="185" cy="104" r="17"/><circle cx="310" cy="112" r="17"/>
    <ellipse cx="445" cy="113" rx="23" ry="14"/><ellipse cx="622" cy="138" rx="10" ry="20"/><circle cx="660" cy="196" r="17"/>
  </g>
  <g fill="#C62E7C"><circle cx="65" cy="66" r="4"/><circle cx="74" cy="72" r="4"/><circle cx="66" cy="76" r="3.5"/>
    <circle cx="180" cy="100" r="4"/><circle cx="189" cy="106" r="4"/><circle cx="305" cy="108" r="4"/><circle cx="314" cy="114" r="4"/>
    <circle cx="438" cy="111" r="4"/><circle cx="450" cy="115" r="4"/><circle cx="622" cy="132" r="3.5"/><circle cx="622" cy="144" r="3.5"/>
    <circle cx="655" cy="192" r="4"/><circle cx="664" cy="199" r="4"/></g>
  <!-- bacteria + chemokine gradient -->
  <g fill="#1B6E3C"><rect x="690" y="215" width="12" height="5" rx="2"/><rect x="680" y="205" width="12" height="5" rx="2"/></g>
  <path d="M640 180 C 660 170, 675 175, 688 205" stroke="#1B6E3C" stroke-dasharray="3 3" fill="none"/>
  <!-- labels -->
  <g fill="#28377C">
    <text x="45" y="112">1. Margination</text>
    <text x="140" y="60">2. Rolling</text><text x="133" y="76" fill="#C62E7C">(selectins)</text>
    <text x="270" y="60">3. Firm adhesion</text><text x="262" y="76" fill="#C62E7C">(integrins–ICAM/VCAM)</text>
    <text x="405" y="60">4. Transmigration</text><text x="405" y="76" fill="#C62E7C">(diapedesis, PECAM-1)</text>
    <text x="545" y="60">5. Chemotaxis</text><text x="545" y="76" fill="#C62E7C">(C5a, IL-8, LTB4, fMLP)</text>
  </g>
  <g stroke="#28377C" fill="none" stroke-width="1"><path d="M175 80 L182 88"/><path d="M300 80 L307 95"/><path d="M445 80 L445 99"/><path d="M580 80 L615 120"/></g>
  <text x="15" y="258" fill="#1A1919" font-size="12">Endothelium of post-capillary venule (main site of leukocyte exit)</text>
</svg>
