<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Coming Soon, cursive" font-size="13">
  <!-- adventitia / media / intima bands -->
  <rect x="20" y="230" width="520" height="40" fill="#F3E3C8" stroke="#8A6A3B"/>
  <rect x="20" y="190" width="520" height="40" fill="#F2C9C9" stroke="#A04A4A"/>
  <path d="M20 190 L20 170 C 120 168, 140 168, 170 150 C 220 95, 360 95, 400 150 C 420 168, 460 170, 540 170 L540 190 Z" fill="#FCE9D9" stroke="#A04A4A" stroke-width="1.4"/>
  <!-- fibrous cap -->
  <path d="M170 150 C 220 95, 360 95, 400 150 C 360 118, 220 118, 170 150 Z" fill="#E7E9F7" stroke="#28377C" stroke-width="1.4"/>
  <!-- necrotic core -->
  <ellipse cx="285" cy="158" rx="95" ry="26" fill="#F6E27A" stroke="#9A7B00" stroke-width="1.2"/>
  <g stroke="#9A7B00" stroke-width="1.5"><path d="M240 152 l18 8"/><path d="M270 165 l20 -6"/><path d="M300 150 l16 10"/><path d="M325 163 l18 -4"/></g>
  <!-- foam cells -->
  <g fill="#FFFFFF" stroke="#C62E7C"><circle cx="200" cy="150" r="7"/><circle cx="378" cy="152" r="7"/><circle cx="215" cy="166" r="6"/></g>
  <g fill="#C62E7C"><circle cx="200" cy="150" r="2"/><circle cx="378" cy="152" r="2"/><circle cx="215" cy="166" r="2"/></g>
  <!-- calcification -->
  <g fill="#7A7A7A"><circle cx="330" cy="176" r="3"/><circle cx="338" cy="173" r="2.5"/><circle cx="345" cy="177" r="3"/></g>
  <!-- endothelium -->
  <path d="M20 170 C 120 168, 140 168, 170 150 C 220 95, 360 95, 400 150 C 420 168, 460 170, 540 170" fill="none" stroke="#1B6E3C" stroke-width="2.5" stroke-dasharray="7 3"/>
  <text x="30" y="40" fill="#1A1919">Lumen (narrowed)</text>
  <!-- labels -->
  <g fill="#28377C">
    <text x="560" y="105">Fibrous cap</text><text x="560" y="121" font-size="11" fill="#C62E7C">(SMC + collagen)</text>
    <text x="560" y="155">Necrotic (lipid) core</text>
    <text x="560" y="182">Foam cells</text>
    <text x="560" y="206">Cholesterol clefts</text>
    <text x="560" y="230">Calcification</text>
    <text x="560" y="62">Endothelium</text>
    <text x="560" y="255">Media</text>
    <text x="560" y="283">Adventitia</text>
  </g>
  <text x="40" y="186" fill="#1A1919" font-size="12">Intima</text>
  <g stroke="#28377C" stroke-width="1" fill="none">
    <path d="M556 101 L 360 112"/>
    <path d="M556 151 L 300 170"/>
    <path d="M556 178 L 385 153"/>
    <path d="M556 202 L 330 162"/>
    <path d="M556 226 L 347 177"/>
    <path d="M556 58 L 470 168"/>
    <path d="M556 251 L 540 210"/>
    <path d="M556 279 L 540 250"/>
  </g>
</svg>
